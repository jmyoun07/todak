<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>토닥 · 약 직접 입력 (시안 10/25)</title>
<link rel="stylesheet" href="../screens/app.css">
<style>
.tbox { width: 140px; min-height: 44px; padding: 10px 6px; font-weight: 700; color: var(--primary-dark);
  flex: 0 0 auto; text-align: center; }

/* ── 새로: '사용 횟수' 대신 '언제 드시나요' ──
   약 봉투의 복용 시간표(아침·점심·저녁·자기 전)와 같은 모양으로, 드시는 시간을 바로 누른다.
   횟수는 고른 개수로 정해진다. 네 칸은 같은 폭 · 48px 높이(손이 떨려도 누를 수 있게). */
.when-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.when-grid .chip, .prn-chip { justify-content: center; min-height: 48px; padding: 10px 4px;
  font-size: 15px; font-weight: 700; border-radius: 14px; }
.when-grid .chip:not(.chip--on), .prn-chip:not(.chip--on) { color: var(--on-surface); }
.prn-chip { display: flex; width: 100%; font-size: 14px; font-weight: 600; }
.when-sum { display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 8px 12px;
  border-radius: 12px; background: var(--primary-tint); color: var(--primary-dark);
  font-size: 14px; font-weight: 700; line-height: 1.45; }
.when-sum.is-empty { background: var(--warn-tint); color: #7a4708; }
.lbl-sub { font-weight: 500; color: var(--on-surface-variant); }
.ocr-note { margin-top: 2px; }
</style>
</head>
<body>
<div class="screen">
  <div class="statusbar statusbar--dark"><span>9:41</span><span class="sb-icons">📶 🔋</span></div>
  <div class="appbar">
    <a class="back" href="#">‹</a>
    <div><div class="appbar-title">약 직접 입력</div></div>
  </div>

  <div class="content content--tight" style="padding-bottom:150px;">
    <div class="photo-block">
      <div class="pb-head">
        <span class="pb-ic">📷</span>
        <div class="grow">
          <div class="pb-t">약 봉투를 찍으면<br>손으로 적지 않으셔도 돼요</div>
          <div class="pb-s">약 이름·드시는 시간·며칠분을 읽어 드려요</div>
        </div>
      </div>
      <a class="pb-btn" href="#">📷 약 봉투 사진 찍기</a>
    </div>
    <div class="or-line">또는 이름으로 직접 입력</div>

    <div class="field" id="at">
      <label>약 이름</label>
      <input class="input" type="text" value="레바미피드정 100mg" aria-label="약 이름">
    </div>

    <div class="field">
      <label>어떤 약인가요</label>
      <div class="chips">
        <span class="chip chip--on">먹는 약</span>
        <span class="chip">눈에 넣는 약</span>
        <span class="chip">바르는 약</span>
        <span class="chip">붙이는 약</span>
        <span class="chip">기타</span>
      </div>
    </div>

    <!-- 새로: 언제 드시나요 -->
    <div class="field">
      <label>언제 드시나요 <span class="lbl-sub">· 드시는 시간을 모두 눌러 주세요</span></label>
      <div class="when-grid" data-role="when">
        <span class="chip" role="checkbox" tabindex="0" data-slot="아침">아침</span>
        <span class="chip" role="checkbox" tabindex="0" data-slot="점심">점심</span>
        <span class="chip" role="checkbox" tabindex="0" data-slot="저녁">저녁</span>
        <span class="chip" role="checkbox" tabindex="0" data-slot="자기전">자기 전</span>
      </div>
      <span class="chip prn-chip" role="checkbox" tabindex="0" data-role="prn">정해진 시간 없이 필요할 때만</span>
      <div class="when-sum" data-role="sum"></div>
      <p class="tiny muted ocr-note" data-role="ocr" hidden>약 봉투에 <b>‘하루 2번’</b>으로 적혀 있어 아침·저녁으로 골라 두었어요. 드시는 시간이 다르면 눌러서 바꿔 주세요.</p>
    </div>

    <div class="field">
      <label>며칠분</label>
      <div class="row" style="align-items:center; gap:8px;">
        <input class="input" type="number" value="30" aria-label="며칠분" style="width:90px; text-align:center;">
        <span class="small" style="flex:0 0 auto;">일</span>
        <span class="tiny muted" style="margin-left:4px;">모르시면 비워 두셔도 돼요</span>
      </div>
    </div>

    <div class="field" data-role="alarm">
      <label>알림 시간 <span class="lbl-sub">· 시각을 누르면 바꿀 수 있어요</span></label>
      <div data-role="alarm-list" style="display:flex; flex-direction:column; gap:8px;"></div>
    </div>

    <div class="banner banner--info">
      <span class="b-ic">💡</span>
      <div class="small"><b>평소 드시는 약</b>도 함께 넣어 주세요.<br>암 치료약과 겹치는 약이 있는지 볼 수 있어요.</div>
    </div>
  </div>

  <div class="footer-actions">
    <a class="btn btn-primary btn-block btn-lg" href="#">추가하기</a>
  </div>
</div>
<script>
(function () {
  function $(s, r) { return (r || document).querySelector(s); }
  function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
  var ORDER = ['아침', '점심', '저녁', '자기전'];
  var LBL = { '아침': '아침', '점심': '점심', '저녁': '저녁', '자기전': '자기 전' };
  var IC = { '아침': '🌅', '점심': '☀️', '저녁': '🌆', '자기전': '🌙' };
  var TM = { '아침': '오전 8:00', '점심': '오후 1:00', '저녁': '오후 7:00', '자기전': '오후 10:00' };
  var q = location.search;
  /* 기본 그림: 피드백 주신 분처럼 아침·점심. ?ocr=2 는 봉투에서 '하루 2번'만 읽힌 경우 */
  var picked = /[?&]ocr=2/.test(q) ? ['아침', '저녁'] : ['아침', '점심'];
  var prn = false;
  if (/[?&]ocr=2/.test(q)) $('[data-role="ocr"]').hidden = false;

  function paint() {
    $$('[data-role="when"] .chip').forEach(function (c) {
      var on = !prn && picked.indexOf(c.getAttribute('data-slot')) > -1;
      c.classList.toggle('chip--on', on);
      c.setAttribute('aria-checked', on ? 'true' : 'false');
    });
    var pc = $('[data-role="prn"]');
    pc.classList.toggle('chip--on', prn);
    pc.setAttribute('aria-checked', prn ? 'true' : 'false');
    var sum = $('[data-role="sum"]');
    var list = ORDER.filter(function (s) { return picked.indexOf(s) > -1; });
    sum.classList.toggle('is-empty', !prn && !list.length);
    sum.textContent = prn ? '필요할 때만 · 알림 없음'
      : list.length ? '하루 ' + list.length + '번 · ' + list.map(function (s) { return LBL[s]; }).join('·')
      : '드시는 시간을 하나 이상 골라 주세요';
    var al = $('[data-role="alarm-list"]');
    al.innerHTML = '';
    $('[data-role="alarm"]').style.display = (prn || !list.length) ? 'none' : '';
    list.forEach(function (s) {
      var li = document.createElement('div');
      li.className = 'listitem';
      li.innerHTML = '<span class="li-ic">' + IC[s] + '</span><div class="li-body"><div class="li-title">' + LBL[s]
        + '</div></div><div class="input tbox">' + TM[s] + '</div>';
      al.appendChild(li);
    });
  }
  $$('[data-role="when"] .chip').forEach(function (c) {
    c.addEventListener('click', function () {
      var s = c.getAttribute('data-slot'), i = picked.indexOf(s);
      prn = false;
      if (i > -1) picked.splice(i, 1); else picked.push(s);
      paint();
    });
  });
  $('[data-role="prn"]').addEventListener('click', function () { prn = !prn; if (prn) picked = []; paint(); });
  paint();
  var c = $('.content'), t = document.getElementById('at');
  if (c && t) c.scrollTop = t.offsetTop - c.offsetTop - 8;
})();
</script>
</body>
</html>
