<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>토닥 · 이메일로 가입하기</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="screen">
  <div class="statusbar statusbar--dark"><span>9:41</span><span class="sb-icons">📶 🔋</span></div>

  <div class="appbar">
    <a class="back" href="97-email-login.html">‹</a>
  </div>

  <!-- 여기서는 계정(이메일·비밀번호)만 만든다. 이름·생년월일은 약관 동의(02) 뒤 기본 정보(03)에서
       간편 로그인과 똑같이 받는다 — 동의 전에 개인정보를 더 받지 않게.
       app.js pageSignup() 이 칸을 aria-label 로 찾는다 — 이름을 바꾸지 말 것. -->
  <div class="content" style="padding-bottom:130px;">
    <div class="auth-head">
      <h1 class="page-title">이메일로 가입하기</h1>
    </div>

    <div class="field field--suggest">
      <label for="suEmail">이메일</label>
      <input class="input" id="suEmail" type="email" inputmode="email" autocomplete="email" autocapitalize="off" spellcheck="false" placeholder="이메일 주소" aria-label="이메일">
    </div>

    <div class="field">
      <label for="suPw">비밀번호</label>
      <div class="pw-wrap">
        <input class="input" id="suPw" type="password" autocomplete="new-password" placeholder="8자 이상" aria-label="비밀번호">
        <button type="button" class="pw-eye" aria-label="비밀번호 표시">👁</button>
      </div>
      <p class="field-hint" id="hintPw" hidden></p>
    </div>

    <div class="field">
      <label for="suPw2">비밀번호 확인</label>
      <div class="pw-wrap">
        <input class="input" id="suPw2" type="password" autocomplete="new-password" placeholder="한 번 더 입력" aria-label="비밀번호 확인">
        <button type="button" class="pw-eye" aria-label="비밀번호 표시">👁</button>
      </div>
      <p class="field-hint" id="hintPw2" hidden></p>
    </div>

    <p class="auth-links small" style="justify-content:flex-start; gap:10px;">
      <span class="muted">가입 전에 읽어 보세요</span>
      <a href="25-terms.html?tab=terms&amp;from=96-email-signup.html">이용약관</a>
      <a href="25-terms.html?tab=privacy&amp;from=96-email-signup.html">개인정보 처리방침</a>
    </p>
  </div>

  <div class="footer-actions">
    <a class="btn btn-primary btn-block btn-lg" id="signupNext" href="02-consent.html" aria-disabled="true">가입하기</a>
  </div>
</div>
</body>
</html>
